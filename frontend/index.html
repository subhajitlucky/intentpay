<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090a" />
  <meta
    name="description"
    content="IntentPay — an AI-assisted Ethereum wallet that prepares transactions and leaves the final approval to you."
  />
  <link rel="icon" type="image/svg+xml" href="/intentpay.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <title>IntentPay — Secure Wallet Protocol</title>
  <script>
    // Resolve the theme before first paint so there is no flash of the wrong one.
    (function () {
      try {
        var saved = localStorage.getItem('intentpay-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (prefersLight ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
